<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surface | MathingSense</title>
    <link rel="stylesheet" href="../style.css">
</head>

<body>

    <a href="../index.html">back</a>

    <h1>Surface</h1>

    <p>
        Drag to rotate the view. Scroll or pinch to zoom.
        On a touchscreen, swipe outside the canvas to scroll the page.
    </p>

    <canvas id="canvas"></canvas>

    <section id="tangent-info">
        <h3>Tangent plane</h3>

        <p>
            Contact point:
            <span id="point-coordinates"></span>
        </p>

        <p>
            Partial derivative in x:
            <span id="derivative-x"></span>
        </p>

        <p>
            Partial derivative in z:
            <span id="derivative-z"></span>
        </p>

        <p>
            Plane equation:
            <span id="plane-equation"></span>
        </p>
    </section>

    <script src="surface.js" type="module"></script>

</body>

</html>
